<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hizmetler - Güreş Dünyası</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #dc2626;
            --secondary-gold: #f59e0b;
            --dark-blue: #1e3a8a;
            --light-bg: #f8fafc;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --success-green: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--light-bg) 0%, #e0e7ff 100%);
            color: var(--text-dark);
            padding-top: 80px;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
            z-index: 1000;
        }

        body.dark-mode .navbar {
            background: rgba(26, 26, 46, 0.95);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary-red);
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
        }

        body.dark-mode .nav-link {
            color: #e0e0e0;
        }

        .nav-link.active {
            color: var(--primary-red);
            font-weight: 700;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }

        .hamburger span {
            width: 25px;
            height: 3px;
            background: var(--text-dark);
            margin: 5px 0;
            transition: 0.3s;
        }

        body.dark-mode .hamburger span {
            background: #e0e0e0;
        }

        /* Page Header */
        .page-header {
            background: linear-gradient(135deg, var(--primary-red) 0%, var(--dark-blue) 100%);
            color: white;
            padding: 3rem 0;
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        /* Services Grid */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .service-card {
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        body.dark-mode .service-card {
            background: #2a2a3e;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .service-card:hover {
            transform: translateY(-10px);
        }

        .service-image {
            font-size: 4rem;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.1) 0%, rgba(245, 158, 11, 0.1) 100%);
        }

        .service-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .service-name {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }

        body.dark-mode .service-name {
            color: #e0e0e0;
        }

        .service-category {
            display: inline-block;
            background: var(--secondary-gold);
            color: var(--text-dark);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
            width: fit-content;
        }

        .service-description {
            font-size: 0.95rem;
            color: var(--text-light);
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        body.dark-mode .service-description {
            color: #b0b0c0;
        }

        .service-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-red);
            margin-bottom: 1rem;
        }

        body.dark-mode .service-price {
            color: var(--secondary-gold);
        }

        .service-actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .btn-favorite {
            background: rgba(220, 38, 38, 0.1);
            color: var(--primary-red);
            border: 2px solid var(--primary-red);
        }

        .btn-favorite:hover {
            background: var(--primary-red);
            color: white;
        }

        .btn-favorite.active {
            background: var(--primary-red);
            color: white;
        }

        .btn-cart {
            background: var(--secondary-gold);
            color: var(--text-dark);
            border: none;
            flex: 2;
        }

        .btn-cart:hover {
            background: #f59e0b;
            transform: scale(1.05);
        }

        /* Notification */
        .notification {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--success-green);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: var(--shadow);
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Footer */
        .footer {
            background: var(--dark-blue);
            color: var(--white);
            text-align: center;
            padding: 2rem;
            margin-top: 4rem;
        }

        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }

            .nav-menu {
                position: fixed;
                left: -100%;
                top: 70px;
                flex-direction: column;
                background-color: var(--white);
                width: 100%;
                text-align: center;
                transition: 0.3s;
                box-shadow: var(--shadow);
            }

            body.dark-mode .nav-menu {
                background-color: #2a2a3e;
            }

            .nav-menu.active {
                left: 0;
            }

            .services-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .services-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        document.addEventListener('DOMContentLoaded', function() {

        // Hizmetleri göster
        function displayServices(services) {
            const container = document.getElementById('servicesContainer');
            container.innerHTML = '';

            services.forEach(service => {
                const card = document.createElement('div');
                card.className = 'service-card';

                const favorites = JSON.parse(localStorage.getItem('favorites')) || [];
                const isFavorite = favorites.some(fav => fav.id === service.id);

                card.innerHTML = `
                    <div class="service-image">${service.image}</div>
                    <div class="service-content">
                        <h3 class="service-name">${service.name}</h3>
                        <span class="service-category">${service.category}</span>
                        <p class="service-description">${service.description}</p>
                        <div class="service-price">₺${service.price}</div>
                        <div class="service-actions">
                            <button class="action-btn btn-favorite ${isFavorite ? 'active' : ''}" 
                                    onclick="toggleFavorite(${service.id})">
                                ${isFavorite ? '❤️' : '🤍'} Favori
                            </button>
                            <button class="action-btn btn-cart" onclick="addToCart(${service.id}, '${service.name}', ${service.price})">
                                🛒 Sepete Ekle
                            </button>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Favorilere ekle
        function toggleFavorite(serviceId) {
            const service = servicesData.find(s => s.id === serviceId);
            let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
            const index = favorites.findIndex(fav => fav.id === serviceId);

            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(service);
            }

            localStorage.setItem('favorites', JSON.stringify(favorites));
            displayServices(servicesData);
        }

        // Sepete ekle
        function addToCart(serviceId, serviceName, servicePrice) {
            const service = servicesData.find(s => s.id === serviceId);
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            
            const existingItem = cart.find(item => item.id === serviceId);
            if (existingItem) {
                existingItem.quantity = (existingItem.quantity || 1) + 1;
            } else {
                service.quantity = 1;
                cart.push(service);
            }

            localStorage.setItem('cart', JSON.stringify(cart));
            showNotification(`✓ ${serviceName} sepete eklendi! (₺${servicePrice})`);
        }

        // Bildirim göster
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Hamburger menü
        function toggleMenu() {
            const menu = document.querySelector('.nav-menu');
            menu.classList.toggle('active');
        }

        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                document.querySelector('.nav-menu').classList.remove('active');
            });
        });
