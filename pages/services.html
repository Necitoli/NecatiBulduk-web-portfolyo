<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Güreş Dünyası Hizmetleri - Kurslar ve Etkinlikler">
    <title>Hizmetler - Güreş Dünyası</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #dc2626;
            --secondary-gold: #f59e0b;
            --dark-blue: #1e3a8a;
            --light-bg: #f8fafc;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --success-green: #10b981;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--light-bg) 0%, #e0e7ff 100%);
            color: var(--text-dark);
            line-height: 1.6;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
            z-index: 1000;
        }

        body.dark-mode .navbar {
            background: rgba(26, 26, 46, 0.95);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary-red);
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            position: relative;
        }

        body.dark-mode .nav-link {
            color: #e0e0e0;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-red);
            transition: all 0.3s ease;
        }

        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }

        .cart-badge {
            background: var(--primary-red);
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            margin-left: 0.5rem;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .hamburger span {
            width: 25px;
            height: 3px;
            background: var(--text-dark);
            border-radius: 2px;
        }

        body.dark-mode .hamburger span {
            background: #e0e0e0;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(8px, 8px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }

        /* Page Header */
        .page-header {
            margin-top: 80px;
            padding: 4rem 1.5rem;
            background: linear-gradient(135deg, var(--primary-red), var(--dark-blue));
            color: var(--white);
            text-align: center;
        }

        .page-header h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        /* Services Section */
        .services-section {
            padding: 4rem 1.5rem;
        }

        .section-title {
            font-size: 2.5rem;
            color: var(--primary-red);
            margin-bottom: 3rem;
            text-align: center;
        }

        body.dark-mode .section-title {
            color: var(--secondary-gold);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .service-card {
            background: var(--white);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        body.dark-mode .service-card {
            background: #2a2a3e;
            color: #e0e0e0;
        }

        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .service-image {
            font-size: 4rem;
            padding: 2rem;
            background: linear-gradient(135deg, var(--primary-red), var(--secondary-gold));
            text-align: center;
            color: var(--white);
        }

        .service-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .service-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        body.dark-mode .service-name {
            color: #e0e0e0;
        }

        .service-category {
            display: inline-block;
            background: var(--secondary-gold);
            color: var(--text-dark);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
            width: fit-content;
        }

        .service-description {
            color: var(--text-light);
            font-size: 0.95rem;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        body.dark-mode .service-description {
            color: #b0b0c0;
        }

        .service-details {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        body.dark-mode .service-details {
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            color: var(--text-light);
            font-size: 0.8rem;
        }

        body.dark-mode .detail-label {
            color: #b0b0c0;
        }

        .detail-value {
            font-weight: 600;
            color: var(--primary-red);
        }

        body.dark-mode .detail-value {
            color: var(--secondary-gold);
        }

        .service-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-red);
            margin-bottom: 1rem;
        }

        body.dark-mode .service-price {
            color: var(--secondary-gold);
        }

        .service-actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .btn-favorite {
            background: rgba(220, 38, 38, 0.1);
            color: var(--primary-red);
            border: 2px solid var(--primary-red);
        }

        .btn-favorite:hover {
            background: var(--primary-red);
            color: white;
        }

        .btn-favorite.active {
            background: var(--primary-red);
            color: white;
        }

        .btn-cart {
            background: var(--secondary-gold);
            color: var(--text-dark);
            border: none;
            flex: 2;
        }

        .btn-cart:hover {
            background: #f59e0b;
            transform: scale(1.05);
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: var(--text-light);
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-top: 4px solid var(--primary-red);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Footer */
        .footer {
            background: var(--dark-blue);
            color: var(--white);
            text-align: center;
            padding: 2rem;
            margin-top: 4rem;
        }

        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }

            .nav-menu {
                position: fixed;
                left: -100%;
                top: 70px;
                flex-direction: column;
                background-color: var(--white);
                width: 100%;
                text-align: center;
                transition: 0.3s;
                box-shadow: var(--shadow);
            }

            body.dark-mode .nav-menu {
                background-color: #2a2a3e;
            }

            .nav-menu.active {
                left: 0;
            }

            .nav-menu li {
                padding: 1rem;
                border-bottom: 1px solid var(--light-bg);
            }

            .page-header h1 {
                font-size: 2rem;
            }

            .services-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .page-header {
                padding: 2rem 1rem;
            }

            .page-header h1 {
                font-size: 1.8rem;
            }

            .services-section {
                padding: 2rem 1rem;
            }

            .section-title {
                font-size: 1.8rem;
            }

            .services-grid {
                grid-template-columns: 1fr;
            }

            .service-actions {
                flex-direction: column;
            }

            .btn-cart {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">⚔️ Güreş</div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Ana Sayfa</a></li>
                <li><a href="about.html" class="nav-link">Güreş Nedir?</a></li>
                <li><a href="wrestlers.html" class="nav-link">Efsaneler</a></li>
                <li><a href="events.html" class="nav-link">Etkinlikler</a></li>
                <li><a href="services.html" class="nav-link active">Hizmetler</a></li>
                <li><a href="contact.html" class="nav-link">İletişim</a></li>
                <li>
                    <a href="cart.html" class="nav-link" style="display: flex; align-items: center;">
                        🛒 Sepet
                        <span class="cart-badge" id="cartBadge">0</span>
                    </a>
                </li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1>Hizmetlerimiz</h1>
            <p>Güreş kursları, antrenmanlar ve etkinlikler</p>
        </div>
    </section>

    <!-- Services Section -->
    <section class="services-section">
        <div class="container">
            <h2 class="section-title">Tüm Hizmetler</h2>
            <div class="services-grid" id="servicesContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Hizmetler yükleniyor...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Güreş Dünyası. Tüm Hakları Saklıdır.</p>
        </div>
    </footer>

    <script src="js/interactions.js"></script>
    <script>
        // Hizmetleri yükle ve göster
        async function loadServices() {
            try {
                const response = await fetch('data/services.json');
                const data = await response.json();
                displayServices(data.services);
                updateCartBadge();
            } catch (error) {
                console.error('Hizmetler yüklenemedi:', error);
                document.getElementById('servicesContainer').innerHTML = 
                    '<p style="grid-column: 1/-1; text-align: center; color: red;">Hizmetler yüklenemedi. Lütfen daha sonra tekrar deneyin.</p>';
            }
        }

        // Hizmetleri kartlarla göster
        function displayServices(services) {
            const container = document.getElementById('servicesContainer');
            container.innerHTML = '';

            services.forEach(service => {
                const card = createServiceCard(service);
                container.appendChild(card);
            });
        }

        // Hizmet kartı oluştur
        function createServiceCard(service) {
            const card = document.createElement('div');
            card.className = 'service-card';

            const favorites = JSON.parse(localStorage.getItem('favorites')) || [];
            const isFavorite = favorites.some(fav => fav.id === service.id);

            card.innerHTML = `
                <div class="service-image">${service.image}</div>
                <div class="service-content">
                    <h3 class="service-name">${service.name}</h3>
                    <span class="service-category">${service.category}</span>
                    <p class="service-description">${service.description}</p>
                    
                    <div class="service-details">
                        <div class="detail-item">
                            <span class="detail-label">Seviye</span>
                            <span class="detail-value">${service.level}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Süre</span>
                            <span class="detail-value">${service.duration}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Puan</span>
                            <span class="detail-value">⭐ ${service.rating}</span>
                        </div>
                    </div>

                    <div class="service-price">₺${service.price}</div>

                    <div class="service-actions">
                        <button class="action-btn btn-favorite ${isFavorite ? 'active' : ''}" 
                                onclick="toggleFavorite(${service.id}, this)"
                                title="Favorilere ekle">
                            ${isFavorite ? '❤️' : '🤍'} Favori
                        </button>
                        <button class="action-btn btn-cart" onclick="addToCart(${service.id})">
                            🛒 Sepete Ekle
                        </button>
                    </div>
                </div>
            `;

            return card;
        }

        // Favorilere ekle/kaldır
        function toggleFavorite(serviceId, button) {
            let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
            const index = favorites.findIndex(fav => fav.id === serviceId);

            if (index > -1) {
                favorites.splice(index, 1);
                button.classList.remove('active');
                button.innerHTML = '🤍 Favori';
            } else {
                // Hizmeti bul ve ekle
                fetch('data/services.json')
                    .then(res => res.json())
                    .then(data => {
                        const service = data.services.find(s => s.id === serviceId);
                        if (service) {
                            favorites.push(service);
                            button.classList.add('active');
                            button.innerHTML = '❤️ Favori';
                        }
                    });
            }

            localStorage.setItem('favorites', JSON.stringify(favorites));
        }

        // Sepete ekle
        function addToCart(serviceId) {
            fetch('data/services.json')
                .then(res => res.json())
                .then(data => {
                    const service = data.services.find(s => s.id === serviceId);
                    if (service) {
                        let cart = JSON.parse(localStorage.getItem('cart')) || [];
                        
                        // Aynı ürün varsa miktarını artır
                        const existingItem = cart.find(item => item.id === serviceId);
                        if (existingItem) {
                            existingItem.quantity += 1;
                        } else {
                            service.quantity = 1;
                            cart.push(service);
                        }

                        localStorage.setItem('cart', JSON.stringify(cart));
                        updateCartBadge();
                        
                        // Başarı mesajı göster
                        showNotification(`${service.name} sepete eklendi!`);
                    }
                });
        }

        // Sepet badge'ini güncelle
        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const totalItems = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
            document.getElementById('cartBadge').textContent = totalItems;
        }

        // Bildirim göster
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 100px;
                right: 20px;
                background: #10b981;
                color: white;
                padding: 1rem 1.5rem;
                border-radius: 8px;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
                z-index: 2000;
                animation: slideIn 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 2000);
        }

        // Hamburger Menü
        const hamburger = document.querySelector('.hamburger');
        const navMenu = document.querySelector('.nav-menu');
        const navLinks = document.querySelectorAll('.nav-link');

        if (hamburger && navMenu) {
            hamburger.addEventListener('click', (e) => {
                e.stopPropagation();
                hamburger.classList.toggle('active');
                navMenu.classList.toggle('active');
            });

            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    hamburger.classList.remove('active');
                    navMenu.classList.remove('active');
                });
            });

            document.addEventListener('click', (e) => {
                if (!navMenu.contains(e.target) && !hamburger.contains(e.target)) {
                    hamburger.classList.remove('active');
                    navMenu.classList.remove('active');
                }
            });
        }

        // Sayfa yüklendiğinde hizmetleri yükle
        document.addEventListener('DOMContentLoaded', () => {
            loadServices();
        });
    </script>
</body>
</html>
